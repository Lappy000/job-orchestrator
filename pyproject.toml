[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-orchestrator"
version = "0.2.0"
description = "A lightweight, high-performance background job processing system with DAG support"
readme = "README.md"
license = {text = "MIT"}
authors = [
{name = "Lappy000"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
keywords = ["job", "queue", "scheduler", "dag", "background-tasks", "worker"]
requires-python = ">=3.10"
# No required dependencies - stdlib only for core functionality
dependencies = []

[project.optional-dependencies]
# Redis backend support
redis = ["redis>=4.0.0"]
# PostgreSQL backend support
postgresql = ["asyncpg>=0.27.0", "psycopg2-binary>=2.9.0"]
# All optional backends
all = ["redis>=4.0.0", "asyncpg>=0.27.0", "psycopg2-binary>=2.9.0"]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
job-orch = "job_orchestrator.cli.main:main"

[project.urls]
Homepage = "https://github.com/Lappy000/job-orchestrator"
Documentation = "https://github.com/Lappy000/job-orchestrator#readme"
Repository = "https://github.com/Lappy000/job-orchestrator.git"
Issues = "https://github.com/Lappy000/job-orchestrator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_orchestrator = ["py.typed"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.isort]
known-first-party = ["job_orchestrator"]
